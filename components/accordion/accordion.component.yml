$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Accordion
status: stable
version: 1.1.0
group: Content
description: 'Wrapper for accordion-item elements (native details/summary), with optional outer border and size variants.'

props:
  type: object
  properties:
    # fields values
    accordion_id:
      type: ['integer', 'string']
      title: Accordion ID
      description: Unique ID for the accordion component.
      default: 0

    accordion_content:
      type: string
      title: Accordion Content
      description: Pre-rendered accordion items content.
      default: ''

    # component variations
    accordion_appearance:
      type: string
      title: Appearance
      enum:
        - 'single'
        - 'multiple'
      default: 'multiple'

    accordion_mode:
      type: boolean
      title: Stay open
      description: A boolean to determine if an accordion item should stay open when another item is opened.
      default: false

    accordion_open_item_id:
      type: integer
      title: Open Item ID
      description: The index of the item that should be opened by default.
      default: 0

    accordion_icon_position:
      type: string
      title: Icon position
      description: 'Marker/Icon position (none|left|right).'
      enum:
        - 'none'
        - 'left'
        - 'right'
      default: 'left'

    accordion_flush:
      type: boolean
      title: Bordered
      description: 'Draws an outer border around the accordion (adds the is-bordered class).'
      default: false

    accordion_size:
      type: string
      title: Size
      description: 'Adds a size modifier class to the accordion wrapper (is-small, is-large).'
      enum:
        - ''
        - 'small'
        - 'large'
      default: ''

    # uc -> utility_classes
    accordion_uc:
      type: array
      items:
        type: string
      title: Accordion Utility Classes
      default: []
      description: An array of utility classes to add to the component.

    # att -> attributes
    accordion_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the accordion.
      default: null

slots:
  content:
    title: Content
    description: Default content text for the accordion.

  icon:
    title: Icon
    description: Default icon for the accordion.
