$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Accordion
status: stable
description: 'Accordion component'
props:
  type: object
  properties:
    # fields value
    accordion_id:
      type: ['integer', 'string']
      title: Accordion ID
      description: Unique ID for the accordion component.
      default: 0


    # component variations

    appearance:
      type: string
      title: 'Appearance'
      enum:
        - 'single'
        - 'multiple'
      default: 'multiple'

    mode:
      type: boolean
      title: Stay open
      description: A boolean to determine if an accordion item should stay open when another item is opened.
      default: false

    open_item_id:
      type: integer
      title: Open Item ID
      description: The index of the item that should be opened by default.
      default: 0

    icon_position:
      type: string
      title: 'Icon position'
      description: 'Marker/Icon position (none|left|right:default).'
      enum:
        - 'none'
        - 'left'
        - 'right'
      default: 'left'

    # uc -> utility_classes
    accordion_uc:
      type: array
      items:
        type: string
      title: Accordion Utility Classes
      default: []
      description: An array of utility classes. Use to add extra Bootstrap utility classes or custom CSS classes over to this component.

    accordion_size:
      type: string
      title: Size
      description: 'Adds a size modifier class to the accordion wrapper (is-small, is-large).'
      enum:
        - ''
        - 'small'
        - 'large'
      default: ''

    accordion_content:
      type: string
      title: Accordion Content
      description: Pre-rendered accordion items content.
      default: ''

    # att -> attributes
    accordion_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the accordion.

      default: null
slots:
  content:
    title: Content
    description: Default content text for the accordion.

  icon:
    title: Icon
    description: Default icon for the accordion.
