$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Breadcrumb
status: stable

version: 1.1.0
group: Navigation
description: 'Breadcrumb: traseul paginii curente în ierarhia site-ului, ca listă ordonată într-un element de navigare, cu separator între elemente și ultimul element evidențiat.'

# Props.
props:
  type: object
  properties:
    # component variations
    breadcrumb_hide_icons:
      type: ['boolean', 'null']
      title: 'Hide Icons'
      description: 'Whether to hide icons in breadcrumb items.'
      default: false

    # fields values
    breadcrumb_tag:
      type: ['string', 'null']
      title: 'Tag'
      enum:
        - null
        - 'nav'
        - 'div'
      description: 'The breadcrumb wrapper tag.'
      default: 'nav'

    breadcrumb_title:
      type: ['string', 'null']
      title: 'Breadcrumb Title'
      description: 'The visually-hidden title for screen readers.'
      default: 'Breadcrumb'

    breadcrumb_items:
      type: array
      title: 'Breadcrumb Items'
      description: 'Array of breadcrumb items with text and optional url.'
      items:
        type: object
        properties:
          text:
            type: string
            title: 'Item text'
          url:
            type: ['string', 'null']
            title: 'Item URL'
      default: []

    # uc -> utility_classes
    breadcrumb_uc:
      type: array
      items:
        type: string
      title: 'Utility Classes'
      description: 'Clase utilitare adăugate elementului rădăcină.'
      default: []

    breadcrumb_list_uc:
      type: array
      items:
        type: string
      title: 'List Utility Classes'
      description: 'Clase utilitare adăugate listei <ol>.'
      default: []

    breadcrumb_item_uc:
      type: array
      items:
        type: string
      title: 'Item Utility Classes'
      description: 'Clase utilitare adăugate fiecărui <li>.'
      default: []

    # att -> attributes
    breadcrumb_att:
      type: Drupal\Core\Template\Attribute
      title: 'Attributes'
      description: 'Atribute HTML pentru elementul rădăcină.'
      default: null

    breadcrumb_list_att:
      type: Drupal\Core\Template\Attribute
      title: 'List Attributes'
      description: 'Atribute HTML pentru lista <ol>.'
      default: null

slots:
  breadcrumb_content:
    title: Breadcrumb Content
    description: The breadcrumb content slot.
