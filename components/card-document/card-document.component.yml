$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Card Document
status: stable
version: 1.1.0
group: Content
description: 'Card for a document node — single link/document makes the whole card clickable; multiple items are listed below the title.'

props:
  type: object
  properties:
    card_document_title:
      type: ['string', 'null']
      title: Title
      description: Node title shown on the card.
      default: null

    card_document_url:
      type: ['string', 'null']
      title: URL
      description: When set and no items are provided, the whole card becomes a link to this URL.
      default: null

    card_document_meta:
      type: ['string', 'null']
      title: Meta
      description: 'Gray subtitle under the title (e.g. "PDF · 1.3 MB"). Only used in single-item mode.'
      default: null

    card_document_type:
      type: string
      title: Type
      description: Which icon to show in the top-left circle.
      enum:
        - link
        - document
      default: link

    card_document_items:
      type: array
      title: Items
      description: 'List of items to render under the title. If more than one, the whole card is NOT a link.'
      default: []
      items:
        type: object
        properties:
          url:
            type: string
          title:
            type: string
          meta:
            type: ['string', 'null']
          type:
            type: string
            enum:
              - link
              - document

    card_document_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    card_document_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
