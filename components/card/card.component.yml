$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Card
status: stable
version: 1.1.0
description: 'Flexible content container with optional header, footer, image, title, subtitle, text and link. Looks are set with CSS variables (--card_*); the defaults add no background or border.'
group: Content
props:
  type: object
  properties:
    card_tag:
      type: ['string', 'null']
      title: Card HTML tag
      default: div
      enum:
        - null
        - div
        - section

    card_body:
      type: ['string', 'null']
      title: Card Body
      default: null

    card_body_tag:
      type: ['string', 'null']
      title: Card Body HTML Tag
      default: div
      enum:
        - null
        - div
        - section

    card_title:
      type: ['string', 'null']
      title: Card Title
      default: null

    card_title_tag:
      type: ['string', 'null']
      title: Card Title HTML Tag
      default: h3
      enum:
        - null
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6

    card_subtitle:
      type: ['string', 'null']
      title: Card Subtitle
      default: null

    card_subtitle_tag:
      type: ['string', 'null']
      title: Card Subtitle HTML Tag
      default: h5
      enum:
        - null
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6

    card_text_tag:
      type: ['string', 'null']
      title: Card Text HTML Tag
      default: div
      enum:
        - null
        - p
        - span
        - div

    card_link_text:
      type: ['string', 'null']
      title: Card Link Text
      default: null

    card_link_url:
      type: ['string', 'null']
      title: Card Link URL
      default: null

    card_link_icon:
      type: ['string', 'null']
      title: Card Link Icon (SVG)
      default: null

    card_link_icon_position:
      type: ['string', 'null']
      title: Card Link Icon Position
      default: right
      enum:
        - left
        - right
        - only

    card_media:
      type: ['string', 'array', 'object', 'null']
      title: Card Media
      default: null

    card_image_src:
      type: ['string', 'null']
      title: Card Image Source URL
      default: null

    card_image_alt:
      type: ['string', 'null']
      title: Card Image Alternative Text
      default: null

    card_image_cap:
      type: string
      title: Image Caption Position
      default: 'top'
      enum:
        - top
        - bottom

    card_image_overlays:
      type: boolean
      title: Use Image Overlays?
      default: false

    card_header:
      type: ['string', 'null']
      title: Card Header
      default: null

    card_footer:
      type: ['string', 'null']
      title: Card Footer
      default: null

    card_border:
      type: boolean
      title: Has Card Border?
      default: false

    card_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card component.
      default: []

    card_title_utility_classes:
      type: array
      items:
        type: string
      title: Title Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card title component.
      default: []

    card_subtitle_utility_classes:
      type: array
      items:
        type: string
      title: Subtitle Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card subtitle component.
      default: []

    card_header_utility_classes:
      type: array
      items:
        type: string
      title: Header Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card header component.
      default: []

    card_body_utility_classes:
      type: array
      items:
        type: string
      title: Body Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card body component.
      default: []

    card_text_utility_classes:
      type: array
      items:
        type: string
      title: Text Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card text component.
      default: []

    card_link_utility_classes:
      type: array
      items:
        type: string
      title: Link Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card link component.
      default: []

    card_footer_utility_classes:
      type: array
      items:
        type: string
      title: Footer Utility Classes
      description: An array of utility classes. These can be used to add extra classes or custom CSS classes to the card footer component.
      default: []

    card_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: HTML attributes for the card root element.
      default: null

    card_title_prefix:
      type: array
      items:
        type: string
      title: Components Title Prefix
      description: Additional output populated by modules, intended to be displayed in front of the components title tag that appears in the template.
      default: []

    card_title_suffix:
      type: array
      items:
        type: string
      title: Components Title Suffix
      description: Additional output populated by modules, intended to be displayed after the components title tag that appears in the template.
      default: []

slots:
  slot_card_image_top:
    title: Card Image Top
    description: Slot for the top image of the card.

  slot_card_image_bottom:
    title: Card Image Bottom
    description: Slot for the bottom image of the card.

  slot_card_body:
    title: Card Body
    description: Slot for the body of the card.

  slot_card_links:
    title: Card Links
    description: Slot for the link section of the card.

  slot_card_footer:
    title: Card Footer
    description: Slot for the footer of the card.
