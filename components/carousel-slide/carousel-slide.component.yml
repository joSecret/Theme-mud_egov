$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Carousel Slide
status: stable
version: 1.1.0
group: Content
description: 'Individual slide for the Carousel component. Renders heading, description, image and optional CTA.'

props:
  type: object
  properties:
    carousel_slide_heading:
      type: ['string', 'null']
      title: Heading
      description: 'Main heading of the slide.'
      default: null

    carousel_slide_heading_tag:
      type: string
      title: Heading Tag
      description: 'HTML tag for the heading.'
      enum: ['h1', 'h2', 'h3', 'h4', 'h5', 'h6']
      default: 'h2'

    carousel_slide_description:
      type: ['string', 'null']
      title: Description
      description: 'Short subtitle or supporting text.'
      default: null

    carousel_slide_image:
      type: ['string', 'null']
      title: Image URL
      description: 'URL of the slide image or illustration.'
      default: null

    carousel_slide_image_alt:
      type: ['string', 'null']
      title: Image Alt
      description: 'Alt text for the image.'
      default: ''

    carousel_slide_image_loading:
      type: string
      title: Image Loading
      description: 'Loading attribute for the image.'
      enum: ['eager', 'lazy']
      default: 'lazy'

    carousel_slide_cta:
      type: ['object', 'null']
      title: CTA
      description: 'Call-to-action link. Object with url and title keys.'
      default: null

    # uc -> utility_classes
    carousel_slide_uc:
      type: array
      items:
        type: string
      title: Carousel Slide Utility Classes
      default: []

    # att -> attributes
    carousel_slide_att:
      type: Drupal\Core\Template\Attribute
      title: Carousel Slide Attributes
      default: null
