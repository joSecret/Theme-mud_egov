'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Date with timezone
status: stable

version: 1.0.0
group: Date and time
description: 'A date component that supports timezones.'

# Props.
props:
  type: object
  properties:
    # component variations
    # fields values
    date_timezone_date_start:
      type: string
      title: Date start

    date_timezone_date_end:
      type: ['string', 'null']
      title: Date end
      default: null

    date_timezone_timezone:
      type: ['string', 'null']
      title: Timezone
      default: null

    # uc -> utility_classes
    date_timezone_uc:
      type: array
      items:
        type: string
      title: Date timezone Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    date_timezone_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the Date timezone component.



      default: null
# Slots.
slots:
  slot_main:
    title: Slot main

  slot_date:
    title: Slot date

  slot_timezone:
    title: Slot timezone
