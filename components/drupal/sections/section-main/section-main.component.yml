$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Section main
status: stable
version: 1.1.0
description: 'Elementul <main> al paginii: hero, zonă evidențiată, conținut principal și zonă de jos, fără bare laterale.'
group: Drupal

# Props.
props:
  type: object
  properties:
    # component variations
    section_main_container:
      type: ['boolean', 'null']
      title: Section main container
      description: Whether to wrap the main section in a container class.
      default: false

    # fields values

    # uc -> utility_classes
    section_main_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      description: An array of utility classes for the main element.
      default: []

    section_main_main_uc:
      type: array
      items:
        type: string
      title: Utility classes main section
      description: An array of utility classes for the inner section element.
      default: []

    # att -> attributes
    section_main_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the main element.
      default: null
    section_main_main_att:
      type: Drupal\Core\Template\Attribute
      title: Main section attributes
      description: A list of HTML attributes for the inner section element.
      default: null

# Slots.
slots:
  slot_highlighted:
    title: Highlighted
    description: Zona evidențiată, după hero.

  slot_content:
    title: Content
    description: Conținutul principal al paginii.

  slot_bottom:
    title: Content bottom
    description: Zona de sub conținut.
