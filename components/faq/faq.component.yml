$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: FAQ
status: stable
version: 1.1.0
group: Content
description: 'FAQ section with optional heading, description, accordion items and CTA cards.'

props:
  type: object
  properties:
    faq_title:
      type: ['string', 'null']
      title: Title
      default: null

    faq_title_level:
      type: integer
      title: Title Level
      enum: [1, 2, 3, 4, 5, 6]
      default: 2

    faq_description:
      type: ['string', 'null']
      title: Description
      default: null

    # uc -> utility_classes
    faq_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    faq_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null

slots:
  faq_items:
    title: FAQ Items
    description: 'Rendered accordion component.'

  faq_cta:
    title: CTA Cards
    description: 'Optional CTA cards rendered at the bottom.'
