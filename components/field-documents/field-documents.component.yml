'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Field Documents
status: stable
version: 1.0.0
group: Components
description: 'A documents field rendered as a stacked list of document items with an optional h3 label.'

# Props.
props:
  type: object

  properties:
    # fields values
    fieldDocuments_items:
      type: array
      title: Items
      description: 'List of document items. Each item: { content: renderable }.'
      default: []

    fieldDocuments_label:
      type: ['string', 'object', 'null']
      title: Label
      description: 'Optional field label displayed above the list.'
      default: null

    fieldDocuments_label_hidden:
      type: boolean
      title: Hide label
      description: 'When true, the label is not rendered.'
      default: false

    # uc -> utility classes
    fieldDocuments_uc:
      type: array
      title: Field Documents Utility Classes
      description: 'Extra classes merged onto the wrapper.'
      default: []

    # att -> attributes
    fieldDocuments_att:
      type: Drupal\Core\Template\Attribute
      title: Field Documents Attributes
      description: 'HTML attributes for the component wrapper.'
      default: null

# Slots.
