'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Field Icon
status: stable
version: 1.1.0
group: Fields
description: 'A field row with an icon on the left and content on the right.'

# Props.
props:
  type: object

  properties:
    # fields values
    field_icon_icon:
      type: ['string', 'null']
      title: Icon
      description: 'The icon element (SVG or img markup).'
      default: null

    field_icon_value:
      type: ['string', 'null']
      title: Value
      description: 'The value displayed next to the icon.'
      default: null

    # uc -> utility classes
    field_icon_uc:
      type: array
      items:
        type: string
      title: Field Icon Utility Classes
      description: 'Extra classes merged onto the wrapper.'
      default: []

    # att -> attributes
    field_icon_att:
      type: ['string', 'object', 'array', 'null']
      title: Field Icon Attributes
      description: 'HTML attributes for the component wrapper.'
      default: null

# Slots.
slots:
  slot_icon:
    title: Icon
    description: The icon element (SVG, img, or icon component).

  slot_content:
    title: Content
    description: The field content displayed next to the icon.
