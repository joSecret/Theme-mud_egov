'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Field Icon
status: stable
version: 1.0.0
group: Components
description: 'A field row with an icon on the left and content on the right.'

# Props.
props:
  type: object

  properties:
    # fields values
    fieldIcon_icon:
      type: ['string', 'null']
      title: Icon
      description: 'The icon element (SVG, img, or icon component).'
      default: null

    fieldIcon_value:
      type: ['string', 'null']
      title: Value
      description: 'The value displayed next to the icon.'
      default: null

    # uc -> utility_classes
    fieldIcon_uc:
      type: array
      items:
        type: string
      title: Field Icon Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    fieldIcon_att:
      type: Drupal\Core\Template\Attribute
      title: Field Icon Attributes
      description: A list of HTML attributes for the component wrapper.

      default: null
# Slots.
slots:
  slot_icon:
    title: Icon
    description: The icon element (SVG, img, or icon component).

  slot_content:
    title: Content
    description: The field content displayed next to the icon.
