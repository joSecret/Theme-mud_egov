'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Field Mail
status: stable
version: 1.1.0
group: Fields
description: 'An email address rendered as a mailto: link with a leading envelope icon.'

# Props.
props:
  type: object

  properties:
    # fields values
    field_mail_value:
      type: ['string', 'null']
      title: Value
      description: 'The email address displayed next to the icon and used for the link.'
      default: null

    # uc -> utility classes
    field_mail_uc:
      type: array
      items:
        type: string
      title: Field Mail Utility Classes
      description: 'Extra classes merged onto the link.'
      default: []

    # att -> attributes
    field_mail_att:
      type: ['string', 'object', 'array', 'null']
      title: Field Mail Attributes
      description: 'HTML attributes for the link.'
      default: null

# Slots.
