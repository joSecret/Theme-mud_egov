'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Field Phone
status: stable
version: 1.1.0
group: Fields
description: 'A phone number rendered as a tel: link (Moldova country code 373 added when missing) with a leading phone icon.'

# Props.
props:
  type: object

  properties:
    # fields values
    field_phone_value:
      type: ['string', 'null']
      title: Value
      description: 'The phone number displayed next to the icon and used for the link.'
      default: null

    # uc -> utility classes
    field_phone_uc:
      type: array
      items:
        type: string
      title: Field Phone Utility Classes
      description: 'Extra classes merged onto the link.'
      default: []

    # att -> attributes
    field_phone_att:
      type: ['string', 'object', 'array', 'null']
      title: Field Phone Attributes
      description: 'HTML attributes for the link.'
      default: null

# Slots.
