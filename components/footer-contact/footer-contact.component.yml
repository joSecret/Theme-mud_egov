$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schemas/v1/metadata.schema.json'
name: 'Footer Contact'
status: stable
version: 1.1.0
group: Layout
description: 'Footer contact block with logo, phone, email, address and a menu slot.'

props:
  type: object
  properties:
    footer_contact_logo_src:
      type: ['string', 'null']
      title: 'Logo image URL'
      default: null
    footer_contact_logo_alt:
      type: ['string', 'null']
      title: 'Logo alt text'
      default: null
    footer_contact_logo_url:
      type: ['string', 'null']
      title: 'Logo link URL'
      default: '/'
    footer_contact_phone:
      type: ['string', 'null']
      title: 'Phone'
      default: null
    footer_contact_email:
      type: ['string', 'null']
      title: 'Email'
      default: null
    footer_contact_address:
      type: ['string', 'null']
      title: 'Address'
      default: null
    footer_contact_uc:
      type: array
      title: 'Footer Contact Utility Classes'
      description: 'Extra classes merged onto the wrapper.'
      default: []
    footer_contact_att:
      type: Drupal\Core\Template\Attribute
      title: 'Footer Contact Attributes'
      description: 'HTML attributes for the component wrapper.'
      default: null
slots:
  menu:
    title: 'Menu'
    description: 'Rendered menu (e.g. Carieră / Angajăm).'
