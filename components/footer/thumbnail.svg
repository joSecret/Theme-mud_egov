<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0099CC"/>

  <!-- Navigation Grid -->
  <rect x="20" y="20" width="360" height="120" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="30" y="40" fill="white" font-size="12" font-weight="bold">Navigation Grid</text>

  <!-- Column representations -->
  <rect x="30" y="50" width="60" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="100" y="50" width="60" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="170" y="50" width="60" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="240" y="50" width="60" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="310" y="50" width="60" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Logos Section -->
  <rect x="20" y="150" width="360" height="50" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="30" y="170" fill="white" font-size="12" font-weight="bold">Logos Section</text>
  <rect x="30" y="175" width="80" height="20" fill="rgba(255,255,255,0.2)" rx="2"/>
  <rect x="120" y="175" width="80" height="20" fill="rgba(255,255,255,0.2)" rx="2"/>

  <!-- Bottom Bar -->
  <rect x="20" y="210" width="360" height="70" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="30" y="230" fill="white" font-size="12" font-weight="bold">Bottom Bar</text>

  <!-- Copyright -->
  <rect x="30" y="240" width="100" height="30" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="40" y="258" fill="white" font-size="9">© Copyright</text>

  <!-- Legal Links -->
  <rect x="150" y="240" width="140" height="30" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="160" y="258" fill="white" font-size="9">Legal Links</text>

  <!-- Social -->
  <rect x="310" y="240" width="60" height="30" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="320" y="258" fill="white" font-size="9">Social</text>
</svg>
