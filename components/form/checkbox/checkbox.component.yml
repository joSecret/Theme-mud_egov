$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Checkbox
status: stable
group: Forms
version: 1.0.0
description: Boolean checkbox input aligned with the MUD design system, supporting label, error state, indeterminate mode, and two sizes.

# Props.
props:
  type: object
  properties:
    # fields values
    checkbox_label:
      type: ['string', 'null']
      title: Label
      description: Visible label text for the checkbox.
      default: null

    checkbox_name:
      type: ['string', 'null']
      title: Name
      description: Form control name used during submission.
      default: null

    checkbox_value:
      type: ['string', 'null']
      title: Value
      description: Value submitted when the checkbox is checked. Defaults to "on".
      default: null

    checkbox_id:
      type: ['string', 'null']
      title: ID
      description: HTML id attribute for the input element.
      default: null

    checkbox_checked:
      type: boolean
      title: Checked
      default: false

    checkbox_disabled:
      type: boolean
      title: Disabled
      default: false

    checkbox_required:
      type: boolean
      title: Required
      default: false

    checkbox_indeterminate:
      type: boolean
      title: Indeterminate
      description: Visual-only indeterminate state (dash glyph). Submitted value still follows checked.
      default: false

    checkbox_error:
      type: boolean
      title: Error
      description: Activates destructive/error visual state.
      default: false

    # component variations
    checkbox_size:
      type: ['string', 'null']
      title: Size
      description: Visual size rung. sm | md — matches MUD CHECKBOX_SIZES.
      default: null
      enum:
        - null
        - sm
        - md

    # uc -> utility_classes
    checkbox_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    checkbox_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component wrapper.
