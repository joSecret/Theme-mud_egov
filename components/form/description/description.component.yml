$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Description
status: stable
version: 1.1.0
group: Forms
description: 'A form field description/help text component for providing additional guidance to users.'

# Props.
props:
  type: object
  required:
    - description_text

  properties:
    # properties props
    description_display:
      type: ['string', 'null']
      title: Display Type
      description: How the description should be displayed.
      enum:
        - null
        - 'visible'
        - 'invisible'
      default: 'visible'

    # fields values
    description_text:
      type: string
      title: Description Text
      description: The help text content to display.

    description_id:
      type: ['string', 'null']
      title: Description ID
      description: The id attribute for the description element (used for aria-describedby).
      default: null

    # uc -> utility_classes
    description_uc:
      type: array
      items:
        type: string
      title: Description Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    description_att:
      type: Drupal\Core\Template\Attribute
      title: Description Attributes
      description: A list of HTML attributes for the description element.

      default: null