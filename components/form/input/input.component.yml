$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Input
status: stable
group: Forms
version: 1.0.0
description: Single-line text input aligned with the MUD design system, supporting label, helper text, error state, icons, and multiple input types.

# Props.
props:
  type: object
  properties:
    # fields values
    input_label:
      type: ['string', 'null']
      title: Label
      description: Visible label text for the input field.
      default: null

    input_placeholder:
      type: ['string', 'null']
      title: Placeholder
      description: Placeholder text shown when the field is empty.
      default: null

    input_value:
      type: ['string', 'null']
      title: Value
      description: Current value of the input.
      default: null

    input_name:
      type: ['string', 'null']
      title: Name
      description: Form control name used during submission.
      default: null

    input_id:
      type: ['string', 'null']
      title: ID
      description: HTML id attribute for the input element.
      default: null

    input_helper_text:
      type: ['string', 'null']
      title: Helper Text
      description: Hint text shown below the input.
      default: null

    input_error_message:
      type: ['string', 'null']
      title: Error Message
      description: Error text shown below the input when in error state.
      default: null

    input_prefix_icon:
      type: ['string', 'null']
      title: Prefix Icon
      description: SVG icon rendered inside the input on the leading side.
      default: null

    input_suffix_icon:
      type: ['string', 'null']
      title: Suffix Icon
      description: SVG icon rendered inside the input on the trailing side.
      default: null

    # component variations
    input_type:
      type: ['string', 'null']
      title: Input Type
      description: Native input type attribute.
      default: 'text'
      enum:
        - null
        - text
        - email
        - password
        - search
        - tel
        - url
        - number

    input_size:
      type: ['string', 'null']
      title: Size
      description: Visual size rung. md | lg — matches MUD INPUT_SIZES.
      default: null
      enum:
        - null
        - md
        - lg

    input_disabled:
      type: boolean
      title: Disabled
      default: false

    input_readonly:
      type: boolean
      title: Read Only
      default: false

    input_required:
      type: boolean
      title: Required
      default: false

    input_error:
      type: boolean
      title: Error
      description: Activates destructive/error visual state.
      default: false

    # uc -> utility_classes
    input_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    input_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component wrapper.
