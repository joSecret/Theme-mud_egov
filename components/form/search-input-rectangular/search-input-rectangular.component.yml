$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Search Input Rectangular
status: stable
group: Forms
version: 1.1.0
description: Câmp de căutare dreptunghiular, aliniat la MUD Search Input Rectangular, cu buton opțional de trimitere integrat.

# Props.
props:
  type: object
  properties:
    # fields values
    search_input_rectangular_label:
      type: ['string', 'null']
      title: Label
      description: Visible label text for the search field.
      default: null

    search_input_rectangular_placeholder:
      type: ['string', 'null']
      title: Placeholder
      description: Placeholder text shown when the field is empty.
      default: null

    search_input_rectangular_name:
      type: ['string', 'null']
      title: Name
      description: Form control name used during submission.
      default: null

    search_input_rectangular_id:
      type: ['string', 'null']
      title: ID
      description: HTML id attribute for the input element.
      default: null

    search_input_rectangular_value:
      type: ['string', 'null']
      title: Value
      description: Current value of the search input.
      default: null

    search_input_rectangular_button_label:
      type: string
      title: Button Label
      description: Accessible label for the trailing submit button.
      default: 'Caută'

    # component variations
    search_input_rectangular_size:
      type: ['string', 'null']
      title: Size
      description: Mărimea componentei, md sau lg.
      default: null
      enum:
        - null
        - md
        - lg

    search_input_rectangular_disabled:
      type: boolean
      title: Disabled
      default: false

    search_input_rectangular_required:
      type: boolean
      title: Required
      default: false

    search_input_rectangular_show_button:
      type: boolean
      title: Show Button
      description: Renders a trailing rectangular submit button.
      default: false

    # uc -> utility_classes
    search_input_rectangular_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    search_input_rectangular_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component.
