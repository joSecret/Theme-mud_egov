$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Select Input
status: stable
group: Forms
version: 1.0.0
description: Native select/dropdown input aligned with the MUD design system, supporting label, helper text, error state, multiple selection, and two sizes.

# Props.
props:
  type: object
  properties:
    # fields values
    select_input_label:
      type: ['string', 'null']
      title: Label
      description: Visible label text for the select field.
      default: null

    select_input_name:
      type: ['string', 'null']
      title: Name
      description: Form control name used during submission.
      default: null

    select_input_id:
      type: ['string', 'null']
      title: ID
      description: HTML id attribute for the select element.
      default: null

    select_input_options:
      type: array
      title: Options
      description: Array of option objects. Each item must have value and label; disabled and selected are optional.
      default: []
      items:
        type: object
        properties:
          value:
            type: string
          label:
            type: string
          selected:
            type: boolean
          disabled:
            type: boolean

    select_input_placeholder:
      type: ['string', 'null']
      title: Placeholder
      description: Empty option shown when no value is selected.
      default: null

    select_input_helper_text:
      type: ['string', 'null']
      title: Helper Text
      description: Hint text shown below the select.
      default: null

    select_input_error_message:
      type: ['string', 'null']
      title: Error Message
      description: Error text shown below the select when in error state.
      default: null

    select_input_multiple:
      type: boolean
      title: Multiple
      description: Allows multiple selections (renders as a listbox).
      default: false

    select_input_disabled:
      type: boolean
      title: Disabled
      default: false

    select_input_required:
      type: boolean
      title: Required
      default: false

    select_input_error:
      type: boolean
      title: Error
      description: Activates destructive/error visual state.
      default: false

    # component variations
    select_input_size:
      type: ['string', 'null']
      title: Size
      description: Visual size rung. md | lg — matches MUD SELECT_INPUT_SIZES.
      default: null
      enum:
        - null
        - md
        - lg

    # uc -> utility_classes
    select_input_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    select_input_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component wrapper.
