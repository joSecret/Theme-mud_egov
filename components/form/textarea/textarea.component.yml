$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Textarea
status: stable
group: Forms
version: 1.1.0
description: Multi-line text input aligned with the MUD design system, supporting label, helper text, error state, resize control, and two sizes.

# Props.
props:
  type: object
  properties:
    # fields values
    textarea_label:
      type: ['string', 'null']
      title: Label
      description: Visible label text for the textarea.
      default: null

    textarea_name:
      type: ['string', 'null']
      title: Name
      description: Form control name used during submission.
      default: null

    textarea_id:
      type: ['string', 'null']
      title: ID
      description: HTML id attribute for the textarea element.
      default: null

    textarea_placeholder:
      type: ['string', 'null']
      title: Placeholder
      description: Placeholder text shown when the field is empty.
      default: null

    textarea_value:
      type: ['string', 'null']
      title: Value
      description: Current text content of the textarea.
      default: null

    textarea_rows:
      type: ['integer', 'null']
      title: Rows
      description: Minimum visible rows (initial height floor).
      default: 4

    textarea_helper_text:
      type: ['string', 'null']
      title: Helper Text
      description: Hint text shown below the textarea.
      default: null

    textarea_error_message:
      type: ['string', 'null']
      title: Error Message
      description: Error text shown below the textarea when in error state.
      default: null

    textarea_disabled:
      type: boolean
      title: Disabled
      default: false

    textarea_readonly:
      type: boolean
      title: Read Only
      default: false

    textarea_required:
      type: boolean
      title: Required
      default: false

    textarea_error:
      type: boolean
      title: Error
      description: Activates destructive/error visual state.
      default: false

    # component variations
    textarea_size:
      type: ['string', 'null']
      title: Size
      description: Visual size rung. md | lg — matches MUD TEXTAREA_SIZES.
      default: null
      enum:
        - null
        - md
        - lg

    textarea_resize:
      type: ['string', 'null']
      title: Resize
      description: User resize affordance. vertical | none — matches MUD TEXTAREA_RESIZE.
      default: null
      enum:
        - null
        - vertical
        - none
        - horizontal
        - both

    # uc -> utility_classes
    textarea_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    textarea_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component wrapper.
