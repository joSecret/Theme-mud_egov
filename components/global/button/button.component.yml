$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Button
status: stable
group: Globals
version: 3.0.0
description: Button component aligned with MUD design system. Supports multiple variants, appearances, sizes, shapes and states.

# Props.
props:
  type: object
  required:
    - button_label

  properties:
    # fields values
    button_label:
      type: string
      title: Label
      description: Visible text content.
      default: ''

    button_url:
      type: ['string', 'null']
      title: URL
      description: Renders the button as `<a>` when set.
      default: null

    button_id:
      type: ['string', 'null']
      title: ID
      default: null

    button_target:
      type: ['string', 'null']
      title: Target
      description: anchor target. Used only when url is set.
      default: null

    button_rel:
      type: ['string', 'null']
      title: Rel
      description: anchor rel. Used only when url is set.
      default: null

    button_name:
      type: ['string', 'null']
      title: Name
      description: Form control name. Used when type=submit.
      default: null

    button_value:
      type: ['string', 'null']
      title: Value
      description: Form control value submitted alongside name.
      default: null

    button_icon:
      type: ['string', 'null']
      title: Icon
      description: SVG icon code. Include aria-hidden="true".
      default: null

    button_icon_second:
      type: ['string', 'null']
      title: Second icon
      description: SVG icon code. Include aria-hidden="true".
      default: null

    # component variations
    button_tag:
      type: ['string', 'null']
      title: Button tag
      description: HTML tag. Defaults to `button`, or `a` when button_url is set.
      default: null
      enum:
        - null
        - a
        - button
        - span
        - input
        - summary

    button_variant:
      type: ['string', 'null']
      title: Variant
      description: Color treatment. null = primary. Outlined and text exist only for primary, strict and destructive.
      default: null
      enum:
        - null
        - primary
        - secondary
        - strict
        - neutral
        - destructive

    button_appearance:
      type: ['string', 'null']
      title: Appearance
      description: Visual treatment. null = filled.
      default: null
      enum:
        - null
        - filled
        - outlined
        - text

    button_size:
      type: ['string', 'null']
      title: Size
      default: null
      enum:
        - null
        - sm
        - md
        - lg

    button_shape:
      type: ['string', 'null']
      title: Shape
      description: Container silhouette. circular = fully rounded.
      default: null
      enum:
        - null
        - none
        - rectangular
        - circular

    button_icon_position:
      type: ['string', 'null']
      title: Icon position
      description: Icon position relative to label. null = right when an icon is set.
      default: null
      enum:
        - null
        - right
        - left
        - only

    button_disabled:
      type: boolean
      title: Disabled
      default: false

    button_loading:
      type: boolean
      title: Loading
      description: Shows a spinner and blocks interactivity. Sets aria-busy on the control.
      default: false

    button_full_width:
      type: boolean
      title: Full width
      description: Expands the button to fill its container.
      default: false

    button_aria_expanded:
      type: ['boolean', 'null']
      title: Aria expanded
      description: Use only for buttons that toggle visibility (dropdown, accordion).
      default: null

    button_role:
      type: ['string', 'null']
      title: Role
      description: ARIA role.
      default: null

    button_aria_label:
      type: ['string', 'null']
      title: Aria label
      description: Accessible name forwarded to aria-label. Required for icon-only buttons.
      default: null

    # uc -> utility_classes
    button_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    button_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

slots:
  slot_content:
    title: Content
    description: Main button content.

  slot_icon:
    title: Icon
    description: Icon (left, right or only).

  slot_icon_second:
    title: Second icon
    description: Second icon when position is right or only.
