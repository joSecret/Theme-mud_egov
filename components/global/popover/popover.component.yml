$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Popover
status: stable
group: Globals
version: 1.1.0
description: 'Panel anchored to a trigger element through the native popover API, holding free content or a list of menu items.'

# Props.
props:
  type: object

  required:
    - popover_id

  properties:
    # component variations
    popover_id:
      type: ['string', 'null']
      title: Anchor
      description: 'ID of the popover; the trigger uses the same value as its popover target and anchor name.'
      default: null

    popover_mobile_panel:
      type: boolean
      title: Mobile Panel
      description: 'On mobile, slides in from the right and covers the full viewport height below the navbar.'
      default: false

    # fields values
    popover_content:
      type: ['string', 'null']
      title: Content
      description: 'Free content, used when popover_menu_items is empty.'
      default: null

    popover_menu_items:
      type: ['array', 'null']
      title: Menu items
      description: 'Array of items: [{label, url, icon, active, disabled, divider}]'
      default: null
      items:
        type: object
        properties:
          label:
            type: string
          url:
            type: ['string', 'null']
          icon:
            type: ['string', 'null']
          active:
            type: boolean
          disabled:
            type: boolean
          divider:
            type: boolean

    # uc -> utility_classes
    popover_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    popover_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component.

# Slots.
slots:
  slot_content:
    title: Content
    description: Default content of the popover.
