$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Spinner
status: stable
group: Globals
version: 1.1.0
description: CSS-only animated circular loading indicator, in four sizes and four color treatments.

# Props.
props:
  type: object
  properties:
    # component variations
    # fields values
    spinner_size:
      type: ['string', 'null']
      title: Size
      description: Visual size rung.
      default: null
      enum:
        - null
        - xs
        - sm
        - md
        - lg

    spinner_variant:
      type: ['string', 'null']
      title: Variant
      description: Color treatment.
      default: null
      enum:
        - null
        - ''
        - brand
        - dark
        - light
        - light-on-color

    spinner_label:
      type: string
      title: Label
      description: Accessible label for screen readers.
      default: 'Loading'

    # uc -> utility_classes
    spinner_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    spinner_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
