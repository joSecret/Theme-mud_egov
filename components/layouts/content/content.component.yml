$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Content layout
status: stable
version: 1.1.0
group: Layout
description: 'Content area on the page grid with an optional sidebar. On large screens the sidebar sits in the left columns; on small screens it becomes an off-canvas panel opened with a button.'

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

props:
  type: object
  properties:
    # component variations
    content_layout_type:
      type: ['string', 'null']
      title: Layout type
      description: 'Column layout. The sidebar is rendered only for col_2_sidebar. Default (null) is col_1.'
      default: null
      enum:
        - null
        - col_1
        - col_1_full
        - col_2_sidebar
        - full

    # uc -> utility_classes
    content_uc:
      type: array
      items:
        type: string
      title: Content layout Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    content_sidebar_uc:
      type: array
      items:
        type: string
      title: Sidebar Utility Classes
      description: An array of utility classes for the sidebar wrapper.
      default: []

    content_main_uc:
      type: array
      items:
        type: string
      title: Content Utility Classes
      description: An array of utility classes for the content wrapper.
      default: []

    # att -> attributes
    content_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the root element.
      default: null

    content_sidebar_att:
      type: Drupal\Core\Template\Attribute
      title: Sidebar Attributes
      description: A list of HTML attributes for the sidebar wrapper.
      default: null

    content_main_att:
      type: Drupal\Core\Template\Attribute
      title: Content Attributes
      description: A list of HTML attributes for the content wrapper.
      default: null

slots:
  cls_addons:
    title: Addons
    description: 'Addons slot used for title prefix, title suffix or other extra information.'
  sidebar:
    title: Sidebar
    description: 'Sidebar content, rendered only for the col_2_sidebar layout.'
  content:
    title: Content
    description: 'Main content.'
