$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Media
status: stable
version: 1.0.0
group: Media
description: 'A simple media box wrapper component.'

# Props.
props:
  type: object
  properties:
    # uc -> utility_classes
    media_uc:
      type: array
      items:
        type: string
      title: Media Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    media_att:
      type: Drupal\Core\Template\Attribute
      title: Media Attributes
      description: A list of HTML attributes for the component.

      default: null
# Slots.
slots:
  slot_addons:
    title: Addons
    description: Contextual links and other auxiliary elements.

  slot_content:
    title: Content
    description: The media item content.
