$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Media & Text Section
status: stable

version: 1.0.0
group: Layout
description: 'Media & Text Section component.'

# Props.
props:
  type: object
  required:
    - mediaText_media

  properties:
    # component variations
    mediaText_title_tag:
      type: string
      title: 'Title Tag'
      description: 'The HTML tag to use for the title. Default is h3.'
      enum:
        - 'h2'
        - 'h3'
        - 'h4'
        - 'h5'
        - 'h6'
        - 'div'
      default: 'h3'

    # fields values
    mediaText_title:
      type: ['string', 'null']
      title: 'Title'
      description: 'The title for the Media & Text Section.'
      default: null

    mediaText_media:
      type: ['string', 'object', 'array']
      title: 'Media'
      description: 'Media content for the Media & Text Section.'

    mediaText_text:
      type: ['string', 'null']
      title: 'Text'
      description: 'Text content for the Media & Text Section.'
      default: null

    # uc -> utility_classes
    mediaText_uc:
      type: array
      items:
        type: string
      title: Media & Text Section Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    mediaText_title_uc:
      type: array
      items:
        type: string
      title: Media & Text Section Title Utility Classes
      default: []

    mediaText_media_uc:
      type: array
      items:
        type: string
      title: Media & Text Section Media Utility Classes
      default: []

    mediaText_text_uc:
      type: array
      items:
        type: string
      title: Media & Text Section Text Utility Classes
      default: []

    # att -> attributes
    mediaText_att:
      type: Drupal\Core\Template\Attribute
      title: Media & Text Section Attributes
      description: A list of HTML attributes for the Media & Text Section.

      default: null
    mediaText_title_att:
      type: Drupal\Core\Template\Attribute
      title: Media & Text Section Title Attributes

      default: null
    mediaText_media_att:
      type: Drupal\Core\Template\Attribute
      title: Media & Text Section Media Attributes

      default: null
    mediaText_text_att:
      type: Drupal\Core\Template\Attribute
      title: Media & Text Section Text Attributes


      default: null
# Slots.
slots:
  slot_title:
    title: Title
    description: Default content text for the Media & Text Section title.

  slot_media:
    title: Media
    description: Default media content for the Media & Text Section.

  slot_text:
    title: Text
    description: Default text content for the Media & Text Section.
