$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Menu
status: stable
group: Globals
version: 1.0.0
description: Dropdown/context menu with keyboard navigation, ARIA roles, and outside-click dismiss.

# Props.
props:
  type: object
  properties:
    # fields values
    menu_items:
      type: ['array', 'null']
      title: Menu items
      description: 'Array of items: [{label, url, icon, disabled, divider}]'
      default: []
      items:
        type: object
        properties:
          label:
            type: string
          url:
            type: ['string', 'null']
          icon:
            type: ['string', 'null']
          disabled:
            type: boolean
          divider:
            type: boolean

    menu_trigger_label:
      type: ['string', 'null']
      title: Trigger label
      description: Label for the default trigger button when slot_trigger is not used.
      default: null

    # component variations
    menu_type:
      type: ['string', 'null']
      title: Type
      description: contextual (action menu) or selection (single-select list).
      default: null
      enum:
        - null
        - contextual
        - selection

    menu_position:
      type: ['string', 'null']
      title: Position
      description: Panel placement relative to the trigger.
      default: null
      enum:
        - null
        - bottom-start
        - bottom-end
        - top-start
        - top-end

    menu_open:
      type: boolean
      title: Open
      description: Initial open state.
      default: false

    # uc -> utility_classes
    menu_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    menu_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null
      description: A list of HTML attributes for the component.

slots:
  slot_trigger:
    title: Trigger
    description: Custom trigger element. Falls back to a default button using menu_trigger_label.
