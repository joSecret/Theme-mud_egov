$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Scroll Navigation
status: stable

version: 1.0.0
group: Navigation
description: 'Scroll Navigation component with marker/icon position control.'

# Props.
props:
  type: object
  properties:
    # component variations
    # fields values
    nav_scroll_navigation:
      type: boolean
      title: 'Disable Navigation'
      description: 'Select the navigation menu to be used in the Scroll Navigation component.'
      default: true

    # uc -> utility_classes
    nav_scroll_uc:
      type: array
      items:
        type: string
      title: Scroll Navigation Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    nav_scroll_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the Scroll Navigation component.

      default: null
# Slots.
slots:
  slot_content:
    title: Content
    description: Default content text for the Scroll Navigation component.
