$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Scroll Navigation
status: stable

version: 1.1.0
group: Navigation
description: 'Listă de navigare cu derulare orizontală, butoane înainte/înapoi, snap la elemente și centrarea automată a elementului activ (clasa .active sau radio bifat).'

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

# Props.
props:
  type: object
  properties:
    # component variations
    # fields values
    nav_scroll_navigation:
      type: boolean
      title: 'Show Navigation Buttons'
      description: 'Afișează butoanele înainte/înapoi pentru derulare.'
      default: true

    # uc -> utility_classes
    nav_scroll_uc:
      type: array
      items:
        type: string
      title: Scroll Navigation Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    nav_scroll_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: A list of HTML attributes for the Scroll Navigation component.

      default: null
# Slots.
slots:
  slot_content:
    title: Content
    description: Elementele din lista derulabilă (linkuri, butoane sau .form-item cu radio).

  slot_btn_prev:
    title: Previous Button
    description: Butonul de derulare spre stânga.

  slot_btn_next:
    title: Next Button
    description: Butonul de derulare spre dreapta.
