$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Navbar
status: stable
version: 1.1.0
group: Navigation
description: 'Bara de sus a paginii: branding, meniu principal, căutare și zona utilizatorului, cu panou pentru meniul principal pe mobil.'

props:
  type: object
  properties:
    navbar_att:
      type: Drupal\Core\Template\Attribute
      title: Component attribute
      description: Wrapper component attributes
      default: null

    navbar_branding_att:
      type: Drupal\Core\Template\Attribute
      title: Component branding attribute
      description: Component Branding attributes
      default: null

    navbar_nav_att:
      type: Drupal\Core\Template\Attribute
      title: Component navigation attribute
      description: Component navigation attributes
      default: null

    navbar_search_att:
      type: Drupal\Core\Template\Attribute
      title: Component search attribute
      description: Component search attributes
      default: null

    navbar_uc:
      type: array
      items:
        type: string
      title: Navbar classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    navbar_branding_uc:
      type: array
      items:
        type: string
      title: Navbar branding classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    navbar_nav_uc:
      type: array
      items:
        type: string
      title: Navbar navigation classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    navbar_search_uc:
      type: array
      items:
        type: string
      title: Navbar Search classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

slots:
  slot_branding:
    title: Branding
    description: Not rendered by the template; the branding comes from the page.branding region.

  slot_nav:
    title: Content
    description: Not rendered by the template; the main menu comes from the page.nav_main region.

  slot_header:
    title: Content
    description: Not rendered by the template; the user area comes from the page.header region.

  slot_search_dropdown:
    title: Search Dropdown
    description: Not rendered by the template; the search comes from the page.nav_search region.
