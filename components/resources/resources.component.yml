$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Resources
status: stable
version: 1.1.0
group: Content
description: 'Resources section with optional eyebrow label, heading and a list of card-icon items.'

props:
  type: object
  properties:
    resources_label:
      type: ['string', 'null']
      title: Eyebrow Label
      default: null

    resources_title:
      type: ['string', 'null']
      title: Title
      default: null

    resources_title_level:
      type: integer
      title: Title Level
      enum: [1, 2, 3, 4, 5, 6]
      default: 2

    # uc -> utility_classes
    resources_uc:
      type: array
      items:
        type: string
      title: Utility Classes
      default: []

    # att -> attributes
    resources_att:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      default: null

slots:
  resources_items:
    title: Resource Items
    description: 'Rendered card-icon paragraphs.'
