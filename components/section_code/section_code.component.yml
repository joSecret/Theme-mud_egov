$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: sectionCode
status: stable
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
version: 1.0.0
group: Documentation
description: 'A documentation box component with heading, description, and content slot.'

# Props.
props:
  type: object
  properties:
    # component variations
    # fields values
    sectionCode_heading:
      type: ['string', 'null']
      title: 'Heading'
      description: 'The sectionCode heading text.'
      default: null

    sectionCode_description:
      type: ['string', 'null']
      title: 'Description'
      description: 'The sectionCode description text.'
      default: null

    sectionCode_code:
      type: ['string', 'null']
      title: 'Code'
      description: 'Raw code string to display in the code block (Twig, HTML, etc.).'
      default: null

    # uc -> utility_classes
    sectionCode_uc:
      type: array
      items:
        type: string
      title: sectionCode Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    sectionCode_att:
      type: Drupal\Core\Template\Attribute
      title: sectionCode Attributes
      description: A list of HTML attributes for the component.

      default: null
# Slots.
slots:
  slot_content:
    title: Content
    description: The main content of the sectionCode.
