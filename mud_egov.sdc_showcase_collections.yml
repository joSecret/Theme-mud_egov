egov_feedback:
  label: 'Feedback & Alerte'
  description: 'Alerte, banner-uri, notificări și mesaje inline.'
  components:

    # ── Notification (subtle — inline messenger) ────────────────────────────
    - component: 'mud_egov:notification'
      props:
        notification_variant: info
        notification_emphasis: subtle
        notification_title: 'Informație'
        notification_message: 'Această pagină conține informații actualizate referitoare la serviciile disponibile.'
        notification_dismissible: false

    - component: 'mud_egov:notification'
      props:
        notification_variant: success
        notification_emphasis: subtle
        notification_title: 'Cerere trimisă'
        notification_message: 'Cererea dumneavoastră a fost înregistrată cu succes. Veți fi contactat în 3 zile lucrătoare.'
        notification_dismissible: true

    - component: 'mud_egov:notification'
      props:
        notification_variant: warning
        notification_emphasis: subtle
        notification_title: 'Atenție'
        notification_message: 'Sesiunea dumneavoastră expiră în 5 minute. Salvați progresul înainte de a continua.'
